name: test build

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build
        run: docker build . -t ffmpeg-test

      # "Is the binary built the way it should be?" - build options, codec table,
      # pkg-config.
      - name: Run build tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            ffmpeg-test bash /tests/run-build-tests.sh

      # "Can this build encode X at all?" - the capability check.
      - name: Run media tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test-media:/test-media:ro" \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            ffmpeg-test bash /tests/run-media-tests.sh

      # "Does a real downstream argument set still produce the same file?" - the
      # regression check. It runs whole transcode profiles end to end and examines the
      # OUTPUT: container facts exactly (codec, profile, level, tag, pixel format, moov
      # before mdat), signal quality against the input within a band. Those are the things
      # an image can break while every codec is still present and every capability test
      # still passes. Takes a few seconds; see tests/run-profile-regression-tests.sh.
      - name: Run downstream profile regression tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test-media:/test-media:ro" \
            -v "${{ github.workspace }}/tests:/tests:ro" \
            ffmpeg-test bash /tests/run-profile-regression-tests.sh
